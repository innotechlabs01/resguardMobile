name: resignar
description: "ResGuard - Residential Security Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  provider: ^6.1.5
  
  # Navigation
  go_router: ^15.1.2
  
  # Auth - Clerk
  clerk_flutter: ^0.0.14-beta
  
  # Database - Supabase (for FCM token registration only)
  supabase_flutter: ^2.8.2
  
  # HTTP Client for API calls
  http: ^1.2.2
  
  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  
  # Utils
  intl: ^0.20.2
  get_it: ^8.0.3
  uuid: ^4.5.1
  
  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  
  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.development
    - .env.productivo